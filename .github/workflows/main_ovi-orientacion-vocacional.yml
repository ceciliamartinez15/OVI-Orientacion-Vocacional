
name: Build and deploy OVI to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'

      - name: Restaurar dependencias
        run: dotnet restore src/OVI.Presentacion/OVI.Presentacion.csproj

      - name: Compilar OVI
        run: dotnet build src/OVI.Presentacion/OVI.Presentacion.csproj --configuration Release --no-restore

      - name: Publicar aplicacion web
        run: dotnet publish src/OVI.Presentacion/OVI.Presentacion.csproj --configuration Release --no-restore --output ./publish

      - name: Subir archivos publicados
        uses: actions/upload-artifact@v4
        with:
          name: ovi-app
          path: ./publish

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Descargar aplicacion publicada
        uses: actions/download-artifact@v4
        with:
          name: ovi-app
          path: ./publish

      - name: Iniciar sesion en Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_A1381246C1C54A658A526736B12ED0D3 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_40FBB46647864CF8A57CD065CA375B0D }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_DB14859E19694534BF68E63F09A68BD2 }}

      - name: Desplegar OVI en Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'ovi-orientacion-vocacional'
          slot-name: 'Production'
          package: ./publish
